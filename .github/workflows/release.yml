# 发布：打 v* 标签触发。先跑测试门禁，再分平台构建（win 在 Windows runner、mac 在 macOS runner
# 保证 zip 保留可执行位、扩展 zip 在 Linux runner），最后汇总创建 GitHub Release。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  test:
    name: 发布前测试门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 桥接：类型检查 + 单测
        working-directory: bridge
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: 扩展：类型检查 + 单测
        working-directory: extension
        run: |
          npm ci
          npx wxt prepare
          npm run typecheck
          npm test

  build-win:
    name: 构建 Windows x64 桥接
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: 安装依赖并按 tag 写入版本号
        working-directory: bridge
        run: |
          npm ci
          node -e "const fs=require('fs');const f='package.json';const j=JSON.parse(fs.readFileSync(f,'utf8'));j.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')" "${GITHUB_REF_NAME#v}" # npm version 会做 semver 规范化，把 2026.10.21.7 改写成 2026.10.2-1.7（.7 扩展 zip 文件名事故）；node 直写 JSON 不校验
      - name: 编译托盘 exe（内嵌桥形图标、GUI 子系统）
        working-directory: bridge
        run: node scripts/build-exe.mjs win
      - name: 产物冒烟：win exe 能跑且自报架构正确（--smoke；GUI 子系统无 stdout，靠退出码断言）
        run: ./bridge/dist/ccc-bridge-win-x64/ccc-bridge.exe --smoke win32 x64
      - name: 打包 zip（含顶层文件夹，用户解压即用）
        run: 7z a -tzip ccc-bridge-win-x64.zip ./bridge/dist/ccc-bridge-win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-win
          path: ccc-bridge-win-x64.zip
          if-no-files-found: error

  build-mac:
    name: 构建 macOS arm64 桥接
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: 安装依赖并按 tag 写入版本号
        working-directory: bridge
        run: |
          npm ci
          node -e "const fs=require('fs');const f='package.json';const j=JSON.parse(fs.readFileSync(f,'utf8'));j.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')" "${GITHUB_REF_NAME#v}" # npm version 会做 semver 规范化，把 2026.10.21.7 改写成 2026.10.2-1.7（.7 扩展 zip 文件名事故）；node 直写 JSON 不校验
      - name: 编译 darwin-arm64
        working-directory: bridge
        run: node scripts/build-exe.mjs darwin
      - name: 组装 .app、ad-hoc 预签并打包 dmg（标准应用包 + 一键解除隔离脚本；hdiutil 保留可执行位与符号链接）
        run: bash bridge/scripts/build-mac-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-mac
          path: ccc-bridge-darwin-arm64.dmg
          if-no-files-found: error

  build-ext:
    name: 构建 Chrome 扩展
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装依赖并按 tag 写入版本号（manifest version 继承 package.json）
        working-directory: extension
        run: |
          npm ci
          node -e "const fs=require('fs');const f='package.json';const j=JSON.parse(fs.readFileSync(f,'utf8'));j.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')" "${GITHUB_REF_NAME#v}" # npm version 会做 semver 规范化，把 2026.10.21.7 改写成 2026.10.2-1.7（.7 扩展 zip 文件名事故）；node 直写 JSON 不校验
      - name: 构建并打包扩展 zip
        working-directory: extension
        run: npx wxt zip
      # upload-artifact v4.4+ 默认排除隐藏目录下的文件：.output 以点开头，zip 会被静默丢光
      # （无文件只 warn 不报错，步骤仍绿），v2026.10.21.5 的 Release 就因此缺扩展包。
      # 先拷到仓库根（非隐藏路径）再上传，与 win/mac 两路一致。
      - name: 拷出 zip 到非隐藏路径
        run: cp extension/.output/*-chrome.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: ccc-extension-*-chrome.zip
          if-no-files-found: error

  publish:
    name: 创建 GitHub Release
    needs: [build-win, build-mac, build-ext]
    runs-on: ubuntu-latest
    steps:
      # gh release create 需要 git 仓库上下文；完整历史与全部 tag 用于生成两版之间的更新列表。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 组装 Release 正文（固定下载说明 + 自动提交列表）
        run: |
          CUR="${GITHUB_REF_NAME}"
          PREV=$(git describe --tags --abbrev=0 "${CUR}^" 2>/dev/null || true)
          HEADER='CopilotCC 把 Claude Code 放进 Chrome 侧边栏：一边看网页，一边让 Claude 阅读、提问并处理本地文件。

          ## 下载

          - **Chrome / Edge**：`ccc-extension-*-chrome.zip`，解压到固定位置后通过「加载已解压的扩展程序」安装。
          - **Windows 10+ x64**：`ccc-bridge-win-x64.zip`，解压后运行 `ccc-bridge.exe`。
          - **macOS Apple Silicon**：`ccc-bridge-darwin-arm64.dmg`，首次使用请右键运行包内的「首次使用-右键打开我.command」。'
          if [ -n "$PREV" ]; then
            LOG=$(git log --no-merges --pretty=format:'- %s' "${PREV}..${CUR}")
            RANGE="${PREV} → ${CUR}"
            LINK=$(printf '\n\n**Full Changelog**: https://github.com/%s/compare/%s...%s' "${GITHUB_REPOSITORY}" "${PREV}" "${CUR}")
          else
            LOG="- 首个版本"
            RANGE="${CUR}"
            LINK=""
          fi
          printf '%s\n\n## 本次变更（%s）\n\n%s%s\n' "$HEADER" "$RANGE" "$LOG" "$LINK" > release-notes.md
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: assets
          merge-multiple: true
      - name: 列出待发布资产（日志可见，防止再出现静默缺包）
        run: ls -la assets/
      - name: 创建 Release 并上传资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md assets/*
