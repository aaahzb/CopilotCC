# 发布：打 v* 标签触发。先跑测试门禁，再分平台构建（win 在 Windows runner、mac 在 macOS runner
# 保证 macOS 可执行位、Windows 绿色单 exe 与扩展 zip），最后汇总创建 GitHub Release。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  test:
    name: 发布前测试门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 桥接：类型检查 + 单测
        working-directory: bridge
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: 扩展：类型检查 + 单测
        working-directory: extension
        run: |
          npm ci
          npx wxt prepare
          npm run typecheck
          npm test

  build-win:
    name: 构建 Windows x64 绿色单文件
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: 安装依赖并按 tag 写入版本号
        working-directory: bridge
        run: |
          npm ci
          node -e "const fs=require('fs');const f='package.json';const j=JSON.parse(fs.readFileSync(f,'utf8'));j.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')" "${GITHUB_REF_NAME#v}" # npm version 会做 semver 规范化，把 2026.10.21.7 改写成 2026.10.2-1.7（.7 扩展 zip 文件名事故）；node 直写 JSON 不校验
      - name: 实探 PTY 路线并编译完整 Windows 发行目录
        working-directory: bridge
        run: |
          node scripts/run-pty-probe.mjs --route auto --target win --root "$RUNNER_TEMP/ccc-pty-win"
          node scripts/build-exe.mjs win --pty-route "$RUNNER_TEMP/ccc-pty-win/pty-route.json"
          node scripts/verify-native-layout.mjs "$GITHUB_WORKSPACE/bridge/dist/ccc-bridge-win-x64" win32 x64
      - name: 产物冒烟：GUI exe 自报架构，完整复制目录通过真实 PTY 行为
        working-directory: bridge
        run: |
          ./dist/ccc-bridge-win-x64/ccc-bridge.exe --smoke win32 x64
          bun build scripts/fake-terminal-claude.ts --compile --target=bun-windows-x64 --outfile "$RUNNER_TEMP/ccc-pty-fake-win.exe"
          mkdir -p "$RUNNER_TEMP/ccc-pty-smoke-win/tmp"
          cp -R dist/ccc-bridge-win-x64 "$RUNNER_TEMP/ccc-pty-smoke-win/app"
          cd "$RUNNER_TEMP/ccc-pty-smoke-win"
          CCC_PTY_SMOKE_CLI="$RUNNER_TEMP/ccc-pty-fake-win.exe" TEMP="$RUNNER_TEMP/ccc-pty-smoke-win/tmp" TMP="$RUNNER_TEMP/ccc-pty-smoke-win/tmp" TMPDIR="$RUNNER_TEMP/ccc-pty-smoke-win/tmp" ./app/ccc-terminal.exe --pty-smoke win32 x64
      - name: 构建绿色单 exe 并在项目树外验收清理、重建与正常启动
        working-directory: bridge
        run: |
          node scripts/run-portable-launcher-tests.mjs
          node scripts/build-portable-exe.mjs
          node scripts/verify-portable-exe.mjs --root "$RUNNER_TEMP/ccc-portable-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@v4
        with:
          name: pty-route-windows
          path: ${{ runner.temp }}/ccc-pty-win/pty-route.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-win
          path: bridge/dist/portable-win-x64/CopilotCC.exe
          if-no-files-found: error

  build-mac:
    name: 构建 macOS arm64 桥接
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: 安装依赖并按 tag 写入版本号
        working-directory: bridge
        run: |
          npm ci
          node -e "const fs=require('fs');const f='package.json';const j=JSON.parse(fs.readFileSync(f,'utf8'));j.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')" "${GITHUB_REF_NAME#v}" # npm version 会做 semver 规范化，把 2026.10.21.7 改写成 2026.10.2-1.7（.7 扩展 zip 文件名事故）；node 直写 JSON 不校验
      - name: 实探 PTY 路线并编译 darwin-arm64 完整发行目录
        working-directory: bridge
        run: |
          node scripts/run-pty-probe.mjs --route auto --target darwin --root "$RUNNER_TEMP/ccc-pty-mac"
          node scripts/build-exe.mjs darwin --pty-route "$RUNNER_TEMP/ccc-pty-mac/pty-route.json"
          node scripts/verify-native-layout.mjs "$GITHUB_WORKSPACE/bridge/dist/ccc-bridge-darwin-arm64" darwin arm64
          bun build scripts/fake-terminal-claude.ts --compile --target=bun-darwin-arm64 --outfile "$RUNNER_TEMP/ccc-pty-fake-mac"
      - name: 组装 .app、内层签名、完整复制包 PTY 冒烟并打包 dmg
        env:
          CCC_PTY_SMOKE_CLI: ${{ runner.temp }}/ccc-pty-fake-mac
        run: bash bridge/scripts/build-mac-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pty-route-macos
          path: ${{ runner.temp }}/ccc-pty-mac/pty-route.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-mac
          path: ccc-bridge-darwin-arm64.dmg
          if-no-files-found: error

  build-ext:
    name: 构建 Chrome 扩展
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装依赖并按 tag 写入版本号（manifest version 继承 package.json）
        working-directory: extension
        run: |
          npm ci
          node -e "const fs=require('fs');const f='package.json';const j=JSON.parse(fs.readFileSync(f,'utf8'));j.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')" "${GITHUB_REF_NAME#v}" # npm version 会做 semver 规范化，把 2026.10.21.7 改写成 2026.10.2-1.7（.7 扩展 zip 文件名事故）；node 直写 JSON 不校验
      - name: 构建并打包扩展 zip
        working-directory: extension
        run: npx wxt zip
      # upload-artifact v4.4+ 默认排除隐藏目录下的文件：.output 以点开头，zip 会被静默丢光
      # （无文件只 warn 不报错，步骤仍绿），v2026.10.21.5 的 Release 就因此缺扩展包。
      # 先拷到仓库根（非隐藏路径）再上传，与 win/mac 两路一致。
      - name: 拷出 zip 到非隐藏路径
        run: cp extension/.output/*-chrome.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: ccc-extension-*-chrome.zip
          if-no-files-found: error

  publish:
    name: 创建 GitHub Release
    needs: [build-win, build-mac, build-ext]
    runs-on: ubuntu-latest
    steps:
      # gh release create 需要 git 仓库上下文；完整历史与全部 tag 用于生成两版之间的更新列表。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 组装 Release 正文（固定下载说明 + 自动提交列表）
        run: |
          CUR="${GITHUB_REF_NAME}"
          PREV=$(git describe --tags --abbrev=0 "${CUR}^" 2>/dev/null || true)
          HEADER='CopilotCC 把 Claude Code 放进 Chrome 侧边栏：一边看网页，一边让 Claude 阅读、提问并处理本地文件。

          ## 下载

          - **Chrome / Edge**：`ccc-extension-*-chrome.zip`，解压到固定位置后通过「加载已解压的扩展程序」安装。
          - **Windows 10+ x64**：`CopilotCC.exe`，绿色单文件，下载后直接运行，无需安装或解压。
          - **macOS Apple Silicon**：`ccc-bridge-darwin-arm64.dmg`，首次使用请右键运行包内的「首次使用-右键打开我.command」。'
          if [ -n "$PREV" ]; then
            LOG=$(git log --no-merges --pretty=format:'- %s' "${PREV}..${CUR}")
            RANGE="${PREV} → ${CUR}"
            LINK=$(printf '\n\n**Full Changelog**: https://github.com/%s/compare/%s...%s' "${GITHUB_REPOSITORY}" "${PREV}" "${CUR}")
          else
            LOG="- 首个版本"
            RANGE="${CUR}"
            LINK=""
          fi
          printf '%s\n\n## 本次变更（%s）\n\n%s%s\n' "$HEADER" "$RANGE" "$LOG" "$LINK" > release-notes.md
      # 固定按名称下载：v4 的 pattern 是单个 Minimatch，不拆多行；缺任一资产会直接失败。
      # 探针报告只保留为 workflow 验收证据，不混入用户下载的 Release 资产。
      - uses: actions/download-artifact@v4
        with:
          name: bridge-win
          path: assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: bridge-mac
          path: assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: extension
          path: assets
          merge-multiple: true
      - name: 列出待发布资产（日志可见，防止再出现静默缺包）
        run: ls -la assets/
      - name: 创建 Release 并上传资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md assets/*
